# MapPeek: EZvac on your web map, on squaremap and BlueMap (0.2.0). Draws
# every weather station's coverage, the area it measures, as a circle with its
# icon and an arrow of its wind; and, as layers a viewer can tick, the wind and
# the air quality across the map, and the time and season.
#
# Admins can change most of this in game with /mappeek (permission
# mappeek.admin); /mappeek reload reads this file again after editing it.

# The time of day and season at the top of the map's layer list (0.2.0), such
# as "14:30 · Summer, day 3 of 15": the clock keeps time on its own.
clock:
  enabled: true

# How often stations' forecasts, the air and the season are brought up to
# date, in seconds (10 to 3600). The wind has its own, under wind.
refresh-seconds: 60

# Temperatures in a station's details: F or C. Wind speeds follow: mph with F,
# km/h with C.
units: F

stations:
  # false leaves weather stations off the map.
  enabled: true
  # The layer's name in the map's layer list.
  layer-name: Weather stations
  # Whether the layer starts hidden until a viewer ticks it.
  hidden-by-default: false
  # Colours, as #RRGGBB: a working station, one switched off, a damaged one.
  colors:
    working: '#4FA3FF'
    off: '#8A8F98'
    damaged: '#E0A030'
  # How solid a circle is filled, 0 to 1; its outline is always drawn.
  fill-opacity: 0.12

# The wind (0.2.0). Arrows point the way it blows, longer the stronger it is;
# a calm spot is a small grey dot.
wind:
  # How often the wind and the stations' arrows are brought up to date, in
  # seconds (5 to 3600): more often than the rest, as the wind gusts and turns.
  refresh-seconds: 15
  # An arrow at the centre of each working weather station.
  station-arrows: true
  # The wind as moving particles, like a weather site's wind map, on squaremap
  # and BlueMap: a "Wind flow" layer (on BlueMap, a marker set) viewers tick.
  # It runs in the viewer's browser and is kept light. BlueMap loads it as an
  # addon script; squaremap has no way for addons to add to its page, so
  # MapPeek adds one script line to squaremap's index.html, and takes it away
  # again when this is false. Viewers with the map already open reload it once.
  animation: false
  # Arrow colours, as #RRGGBB, by how strong it is.
  colors:
    breezy: '#3FBF7F'
    windy: '#E0A030'
    gale: '#E04040'
  # The wind across the map: arrows spacing-blocks apart. area: explored
  # covers everywhere the world has been explored (every region saved so far);
  # spawn covers radius-blocks around spawn. At most 2,500 are drawn; past
  # that they are spread further apart. EZvac works the wind out from the
  # world seed, so nothing is loaded to draw it.
  layer:
    enabled: true
    layer-name: Wind
    hidden-by-default: true
    area: explored
    spacing-blocks: 192
    radius-blocks: 2048
    opacity: 0.85

# Air quality (0.2.0): squares shaded in their US EPA AQI colour, from green
# (Good) to maroon (Hazardous), with the AQI, PM2.5, PM10 and pollen on
# hovering. It is the open outdoor air: the biomes' own, the season's pollen,
# the rain and the wind, without any smoke from buildings. Same grid rules as
# the wind's.
air:
  layer:
    enabled: true
    layer-name: Air quality
    hidden-by-default: true
    area: explored
    spacing-blocks: 128
    radius-blocks: 2048
    opacity: 0.35
